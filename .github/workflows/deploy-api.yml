name: Deploy TEK2day Finance Web

on:
  push:
    branches:
      - main
    # Match Python files by pattern, not by name. Naming them meant a new file
    # silently did not trigger a deploy (0ac8ce8), and the same habit in
    # Dockerfile.api shipped a container that could not start (Aug 2026).
    paths:
      - "*.py"
      - ".github/workflows/deploy-api.yml"
      - "Dockerfile.api"
      - "requirements.txt"
      - "static/**"
      - "templates/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: yfinance-cli
  REGION: us-central1
  SERVICE: tek2day-api
  IMAGE: us-central1-docker.pkg.dev/yfinance-cli/tek2day/api
  RUNTIME_SERVICE_ACCOUNT: tek2day-api@yfinance-cli.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth
        run: gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      - name: Build image
        run: |
          docker build \
            -f Dockerfile.api \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:latest \
            .

      - name: Push image
        run: |
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Deploy Cloud Run
        run: |
          gcloud run deploy $SERVICE \
            --project=$PROJECT_ID \
            --region=$REGION \
            --image=$IMAGE:${{ github.sha }} \
            --service-account=$RUNTIME_SERVICE_ACCOUNT \
            --update-env-vars=MACRO_FIRESTORE_PROJECT=macro-data-222cd \
            --quiet

      # Deploying is not the same as working. In Aug 2026 this workflow reported
      # success while shipping a container that could not start, because nothing
      # ever asked the live site whether it was alive. Now it does, and the job
      # goes red if the site does not answer.
      - name: Smoke test the live site
        run: |
          BASE="https://finance.tek2dayholdings.com"
          for attempt in $(seq 1 6); do
            home=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$BASE/" || echo 000)
            health=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$BASE/partner/v1/health" || echo 000)
            if [ "$home" = "200" ] && [ "$health" = "200" ]; then
              echo "PASS  homepage=$home  health=$health"
              curl -s --max-time 20 "$BASE/partner/v1/health"
              exit 0
            fi
            echo "attempt $attempt/6: homepage=$home health=$health — retrying in 10s"
            sleep 10
          done
          echo ""
          echo "SMOKE TEST FAILED — the deploy completed but the live site is not responding."
          echo "Roll back with:"
          echo "  gcloud run revisions list --service=$SERVICE --project=$PROJECT_ID --region=$REGION"
          echo "  gcloud run services update-traffic $SERVICE --to-revisions=<GOOD_REVISION>=100 --project=$PROJECT_ID --region=$REGION"
          exit 1
