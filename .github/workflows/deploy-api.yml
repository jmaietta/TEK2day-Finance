name: Deploy TEK2day Finance Web

# ⚠️ THIRD-PARTY ACTIONS ARE PINNED TO COMMIT SHAs, NOT TAGS.
#
# `@v4` and `@v2` are MOVING tags: the maintainer can repoint them overnight and
# this workflow silently runs different code tomorrow. A commit SHA cannot move.
# The comment beside each pin records which tag it came from, so upgrading stays
# a deliberate act.
#
# ⚠️ WHAT THIS DOES NOT PROTECT AGAINST, and it is the bigger risk: GitHub
# retiring a RUNNER RUNTIME. These runs already log "Node 20 is being
# deprecated. This workflow is running with Node 24 by default." A SHA-pinned
# action breaks too when the runner refuses its runtime - nothing in this repo
# can prevent that. The only complete protection is building off GitHub
# entirely; the Cloud Build configs and their (disabled) triggers are kept for
# exactly that reason. He has been bitten by this before on TEK2day Pulse.
#
# NOTE: actions/checkout is pinned at the v4 line while v7 is current. Pinning
# today's behaviour was deliberate - zero change now - but being three majors
# behind is itself deprecation risk. Upgrade as its own commit, not as a
# side effect.

on:
  push:
    branches:
      - main
    # Match Python files by pattern, not by name. Naming them meant a new file
    # silently did not trigger a deploy (0ac8ce8), and the same habit in
    # Dockerfile.api shipped a container that could not start (Aug 2026).
    paths:
      - "*.py"
      - ".github/workflows/deploy-api.yml"
      - "Dockerfile.api"
      - "requirements.txt"
      - "static/**"
      - "templates/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: yfinance-cli
  REGION: us-central1
  SERVICE: tek2day-api
  IMAGE: us-central1-docker.pkg.dev/yfinance-cli/tek2day/api
  RUNTIME_SERVICE_ACCOUNT: tek2day-api@yfinance-cli.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed  # v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f  # v2

      - name: Configure Docker auth
        run: gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      - name: Build image
        run: |
          docker build \
            -f Dockerfile.api \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:latest \
            .

      - name: Push image
        run: |
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Deploy Cloud Run
        run: |
          gcloud run deploy $SERVICE \
            --project=$PROJECT_ID \
            --region=$REGION \
            --image=$IMAGE:${{ github.sha }} \
            --service-account=$RUNTIME_SERVICE_ACCOUNT \
            --update-env-vars=MACRO_FIRESTORE_PROJECT=macro-data-222cd \
            --quiet

      # Deploying is not the same as working. In Aug 2026 this workflow reported
      # success while shipping a container that could not start, because nothing
      # ever asked the live site whether it was alive. Now it does, and the job
      # goes red if the site does not answer.
      - name: Smoke test the live site
        run: |
          BASE="https://finance.tek2dayholdings.com"
          for attempt in $(seq 1 6); do
            home=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$BASE/" || echo 000)
            health=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$BASE/partner/v1/health" || echo 000)
            if [ "$home" = "200" ] && [ "$health" = "200" ]; then
              echo "PASS  homepage=$home  health=$health"
              curl -s --max-time 20 "$BASE/partner/v1/health"
              exit 0
            fi
            echo "attempt $attempt/6: homepage=$home health=$health — retrying in 10s"
            sleep 10
          done
          echo ""
          echo "SMOKE TEST FAILED — the deploy completed but the live site is not responding."
          echo "Roll back with:"
          echo "  gcloud run revisions list --service=$SERVICE --project=$PROJECT_ID --region=$REGION"
          echo "  gcloud run services update-traffic $SERVICE --to-revisions=<GOOD_REVISION>=100 --project=$PROJECT_ID --region=$REGION"
          exit 1
