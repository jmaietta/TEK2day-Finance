name: Tests

# Owner, 2026-10-03: TEK2day had no test environment and its deploys ran no
# tests, so a failing test could reach production. Both deploy workflows now
# call this first and deploy only if every test passes. It also runs on its
# own for any branch, so a change can be checked before it reaches main.
#
# Installs the same requirements.txt and Python as the production images
# (python:3.12-slim), plus pytest and httpx, which only the tests need.
# No Google credentials: the tests use fakes and must never reach production data.

on:
  push:
    branches-ignore:
      - main   # main runs these tests through the deploy workflows
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    # Pinned: ubuntu-latest moves to Ubuntu 26.04 from Oct 19, 2026 (chatllm#178).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Run every test
        run: python -m pytest -q -p no:cacheprovider
