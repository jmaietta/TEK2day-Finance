<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TEK2day">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <meta name="description" content="A free browser-based stock terminal. Live quotes, price charts, income statements, balance sheets, cash flows, EPS and revenue estimates, SEC filings, news, and CEO analytics for US-listed stocks.">
  <link rel="canonical" href="https://finance.tek2dayholdings.com/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="TEK2day Finance">
  <meta property="og:title" content="TEK2day Finance — Free Stock Terminal">
  <meta property="og:description" content="Live quotes, charts, financial statements, estimates, SEC filings, and CEO analytics for US-listed stocks. Free, in your browser.">
  <meta property="og:url" content="https://finance.tek2dayholdings.com/">
  <meta property="og:image" content="https://finance.tek2dayholdings.com/static/icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="TEK2day Finance — Free Stock Terminal">
  <meta name="twitter:description" content="Live quotes, charts, financial statements, estimates, SEC filings, and CEO analytics for US-listed stocks. Free, in your browser.">
  <meta name="twitter:image" content="https://finance.tek2dayholdings.com/static/icon-512.png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "name": "TEK2day Finance",
        "url": "https://finance.tek2dayholdings.com/",
        "description": "Free browser-based stock terminal: quotes, charts, financial statements, estimates, SEC filings, and CEO analytics for US-listed stocks.",
        "publisher": { "@id": "https://finance.tek2dayholdings.com/#org" }
      },
      {
        "@type": "Organization",
        "@id": "https://finance.tek2dayholdings.com/#org",
        "name": "TEK2day Holdings",
        "url": "https://finance.tek2dayholdings.com/",
        "logo": "https://finance.tek2dayholdings.com/static/icon-512.png"
      }
    ]
  }
  </script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #000;
      --panel: #070705;
      --panel-2: #0c0c09;
      --line: #1c1b14;
      --line-2: #2b2a1e;
      --text: #e8e6df;
      --muted: #8a8878;
      --amber: #ff9f1c;
      --amber-dim: #b97a14;
      --amber-glow: rgba(255, 159, 28, 0.14);
      --cyan: #38c8d8;
      --green: #2fd47f;
      --red: #ff4d42;
      --sidebar-width: 264px;
      --mono: "IBM Plex Mono", Consolas, monospace;
      --sans: "Archivo", system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: var(--bg); }

    body {
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      overflow: hidden;
    }

    button, input { font: inherit; }
    button { color: inherit; cursor: pointer; background: none; border: 0; }

    .shell {
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      width: 100%;
      height: 100dvh;
    }

    /* ───── sidebar ───── */
    .sidebar {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      border-right: 1px solid var(--line);
      background: var(--panel);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 50px;
      padding: 0 14px;
      border-bottom: 1px solid var(--line);
    }

    .brand img {
      width: 26px;
      height: 26px;
      flex: 0 0 auto;
      background: #fff;
      object-fit: contain;
    }

    .brand strong {
      overflow: hidden;
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: #fff;
      text-transform: uppercase;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .sidebar-body { flex: 1; min-height: 0; overflow: auto; padding: 10px 8px; }

    .section-title {
      margin: 10px 8px 6px;
      color: var(--amber-dim);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .fn-list { display: grid; gap: 1px; }

    .fn-item {
      display: grid;
      grid-template-columns: 104px minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 32px;
      padding: 4px 8px;
      text-align: left;
      border-left: 2px solid transparent;
    }

    .fn-item:hover, .fn-item:focus-visible {
      background: var(--panel-2);
      border-left-color: var(--amber);
      outline: none;
    }

    .fn-code {
      overflow: hidden;
      color: var(--amber);
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.02em;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .fn-desc {
      overflow: hidden;
      color: var(--muted);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .fn-item:hover .fn-desc { color: var(--text); }

    .sidebar-foot {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .dot {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-radius: 999px;
      background: var(--green);
      box-shadow: 0 0 10px rgba(47, 212, 127, 0.7);
    }

    .dot.error { background: var(--red); box-shadow: 0 0 10px rgba(255, 77, 66, 0.7); }

    .foot-link {
      margin-left: auto;
      color: var(--muted);
      text-decoration: none;
    }

    .foot-link:hover { color: var(--amber); }

    /* ───── main ───── */
    .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }

    .command-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 50px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--line);
      background: #040403;
    }

    .mobile-menu-btn { display: none; }

    .icon-btn {
      display: inline-grid;
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid transparent;
      color: var(--muted);
    }

    .icon-btn:hover { border-color: var(--line-2); background: var(--panel-2); color: #fff; }

    .hamburger {
      position: relative;
      width: 16px;
      height: 2px;
      background: currentColor;
    }

    .hamburger::before, .hamburger::after {
      content: "";
      position: absolute;
      left: 0;
      width: 16px;
      height: 2px;
      background: currentColor;
    }

    .hamburger::before { top: -5px; }
    .hamburger::after { top: 5px; }

    .command-form {
      position: relative;
      display: flex;
      align-items: center;
      flex: 1;
      min-width: 0;
      max-width: 880px;
      height: 34px;
      border: 1px solid var(--line-2);
      background: #0a0a07;
    }

    .command-form:focus-within {
      border-color: var(--amber-dim);
      box-shadow: 0 0 0 1px var(--amber-glow), inset 0 0 18px rgba(255, 159, 28, 0.04);
    }

    .command-caret {
      padding: 0 4px 0 12px;
      color: var(--amber-dim);
      font-weight: 600;
    }

    .command-input {
      flex: 1;
      min-width: 0;
      height: 100%;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--amber);
      font-weight: 500;
      letter-spacing: 0.03em;
      caret-color: var(--amber);
    }

    .command-input::placeholder { color: #6b6655; opacity: 1; }

    .go-btn {
      height: 100%;
      flex: 0 0 auto;
      padding: 0 16px;
      border-left: 1px solid var(--line-2);
      background: #131208;
      color: var(--amber);
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.12em;
      white-space: nowrap;
    }

    .go-btn:hover { background: var(--amber); color: #000; }
    .go-btn:disabled { cursor: wait; opacity: 0.6; }

    .command-label {
      display: none;
      overflow: hidden;
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    @media (min-width: 1100px) { .command-label { display: block; } }

    /* ───── content ───── */
    .content {
      flex: 1;
      min-width: 0;
      min-height: 0;
      overflow: auto;
      padding: 12px;
      scrollbar-color: #2b2a1e #000;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr);
      gap: 12px;
      align-items: start;
      max-width: 1480px;
      margin: 0 auto;
    }

    .col { display: grid; gap: 12px; min-width: 0; }

    .single {
      display: grid;
      gap: 12px;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* ───── panels ───── */
    .panel {
      border: 1px solid var(--line);
      background: var(--panel);
      min-width: 0;
    }

    .panel-head {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 32px;
      padding: 0 12px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #11100a 0%, #0a0a07 100%);
    }

    .panel-head h2 {
      overflow: hidden;
      color: var(--amber);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .panel-head .crumb {
      margin-left: auto;
      overflow: hidden;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.06em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .panel-loading {
      padding: 18px 12px;
      color: var(--amber-dim);
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      animation: pulse 1.1s ease-in-out infinite alternate;
    }

    @keyframes pulse { from { opacity: 0.45; } to { opacity: 1; } }

    .panel-error {
      padding: 14px 12px;
      color: var(--red);
      font-size: 11.5px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .panel-note {
      padding: 14px 12px;
      color: var(--muted);
      font-size: 11.5px;
    }

    /* quote header */
    .quote-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 14px 22px;
      padding: 14px 12px 12px;
      border-bottom: 1px solid var(--line);
    }

    .quote-name { display: grid; gap: 2px; min-width: 0; }

    .quote-name h1 {
      font-family: var(--sans);
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: #fff;
      line-height: 1.15;
      overflow-wrap: anywhere;
    }

    .quote-name span { color: var(--muted); font-size: 11px; letter-spacing: 0.08em; }

    .quote-px {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 12px;
      margin-left: auto;
      white-space: nowrap;
    }

    .quote-px .last {
      color: var(--amber);
      font-size: 26px;
      font-weight: 600;
      text-shadow: 0 0 22px var(--amber-glow);
    }

    .quote-px .chg { font-size: 13px; font-weight: 600; }
    .quote-px .vol { color: var(--muted); font-size: 11px; }
    .up { color: var(--green); }
    .down { color: var(--red); }

    /* metric grid */
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
      border-top: 1px solid var(--line);
      border-left: 1px solid var(--line);
      margin: 12px;
    }

    .metric {
      display: grid;
      gap: 3px;
      min-width: 0;
      padding: 8px 10px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: #050504;
    }

    .metric span {
      overflow: hidden;
      color: var(--muted);
      font-size: 9.5px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .metric strong {
      overflow-wrap: anywhere;
      color: #fff;
      font-size: 12.5px;
      font-weight: 600;
    }

    .description {
      padding: 0 12px 12px;
      color: #b9b6aa;
      font-size: 11.5px;
      line-height: 1.6;
    }

    .source-line {
      padding: 7px 12px;
      border-top: 1px solid var(--line);
      color: #6b6655;
      font-size: 10px;
      letter-spacing: 0.05em;
      overflow-wrap: anywhere;
    }

    .sub-title {
      padding: 10px 12px 0;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* tables */
    .table-scroll { overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; }

    th, td {
      padding: 6px 12px;
      font-size: 11.5px;
      text-align: right;
      white-space: nowrap;
    }

    th:first-child, td:first-child { text-align: left; }
    th.cell-left, td.cell-left { text-align: left; white-space: normal; overflow-wrap: anywhere; }

    thead th {
      border-bottom: 1px solid var(--line-2);
      color: var(--amber-dim);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    tbody td { border-bottom: 1px solid #121109; color: var(--text); }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:nth-child(even) td { background: #0a0a07; }
    tbody tr:hover td { background: #14130b; }

    td:first-child { color: var(--muted); }
    td a { color: var(--cyan); text-decoration: none; }
    td a:hover { text-decoration: underline; }
    td code { font-family: var(--mono); font-size: 10.5px; color: var(--text); }

    /* news */
    .news-list { display: grid; }

    .news-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 3px;
      padding: 9px 12px;
      border-bottom: 1px solid #121109;
      color: inherit;
      text-decoration: none;
    }

    .news-item:last-child { border-bottom: 0; }
    .news-item:nth-child(even) { background: #0a0a07; }
    a.news-item:hover { background: #14130b; }

    .news-title {
      color: var(--text);
      font-size: 11.5px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    a.news-item:hover .news-title { color: #fff; }

    .news-meta {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      overflow-wrap: anywhere;
    }

    /* plain output */
    .output-block {
      overflow: auto;
      max-width: 100%;
      padding: 12px;
    }

    .output-block pre {
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.45;
      white-space: pre;
    }

    /* idle state */
    .idle-wrap {
      display: grid;
      place-items: center;
      min-height: 100%;
    }

    .idle {
      display: grid;
      justify-items: center;
      gap: 20px;
      max-width: 560px;
      padding: 24px 16px;
      text-align: center;
    }

    .idle img {
      width: 56px;
      height: 56px;
      background: #fff;
      object-fit: contain;
    }

    .idle h1 {
      font-family: var(--sans);
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #fff;
      text-transform: uppercase;
    }

    .idle .hint {
      margin-top: 6px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .idle .hint code { color: var(--amber); }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
    }

    .chip {
      padding: 6px 12px;
      border: 1px solid var(--line-2);
      background: #0a0a07;
      color: var(--amber);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .chip span { color: var(--muted); font-weight: 400; margin-left: 7px; }
    .chip:hover { border-color: var(--amber-dim); background: var(--panel-2); }
    .chip:hover span { color: var(--text); }

    /* footer */
    .fnbar {
      display: flex;
      align-items: center;
      gap: 4px;
      min-height: 28px;
      padding: 0 10px;
      border-top: 1px solid var(--line);
      background: #050504;
      overflow: hidden;
      white-space: nowrap;
    }

    .fnkey { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; font-size: 10px; }
    .fnkey b { color: var(--amber); font-weight: 600; }
    .fnkey span { color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
    .fnkey:hover { background: var(--panel-2); }

    .fnbar .meta {
      margin-left: auto;
      color: #6b6655;
      font-size: 10px;
      letter-spacing: 0.08em;
    }

    .scrim { display: none; }

    /* ───── price chart ───── */
    .chart-wrap { border-bottom: 1px solid var(--line); }

    .chart-readout {
      padding: 8px 12px 0;
      height: 22px;
      color: var(--muted);
      font-size: 11.5px;
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
    }

    .chart-readout b { color: var(--text); font-weight: 600; }

    .chart-el { width: 100%; height: 360px; }

    .chart-ranges {
      display: flex;
      gap: 4px;
      padding: 10px 12px;
      border-top: 1px solid var(--line);
    }

    .chart-ranges button {
      font-family: var(--mono);
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text);
      padding: 6px 14px;
      border-radius: 3px;
      border: 1px solid var(--line-2);
      background: #0c0c09;
    }

    .chart-ranges button:hover { color: var(--amber); border-color: var(--amber); }
    .chart-ranges button.active { color: #000; background: var(--amber); border-color: var(--amber); }

    /* ───── responsive ───── */
    @media (max-width: 1100px) {
      .grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 760px) {
      body { -webkit-text-size-adjust: 100%; }

      .shell { display: block; height: 100dvh; }

      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        z-index: 40;
        width: min(84vw, 300px);
        transform: translateX(-102%);
        transition: transform 160ms ease;
        box-shadow: 14px 0 40px rgba(0, 0, 0, 0.55);
      }

      .shell.sidebar-open .sidebar { transform: translateX(0); }

      .scrim {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: none;
        background: rgba(0, 0, 0, 0.55);
      }

      .shell.sidebar-open .scrim { display: block; }

      .main { width: 100%; height: 100dvh; }

      .command-bar {
        position: sticky;
        top: 0;
        z-index: 20;
        min-height: 58px;
        padding: 9px 10px;
      }

      .mobile-menu-btn { display: inline-grid; }

      .command-form { height: 42px; max-width: none; }
      .command-input { font-size: 16px; }

      .content { padding: 10px; }
      .grid { gap: 10px; }
      .col { gap: 10px; }

      .metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }

      .chart-el { height: 240px; }
      .chart-readout { padding: 8px 10px 0; font-size: 10px; }
      .chart-ranges button { flex: 1; padding: 10px 0; text-align: center; }

      .quote-px { margin-left: 0; }

      .output-block pre {
        font-size: 11px;
        line-height: 1.5;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .fnbar { display: none; }
    }
  </style>
</head>
<body>
  <div class="shell" id="shell">
    <aside class="sidebar" id="sidebar" aria-label="Command sidebar">
      <div class="brand">
        <img src="/static/tek2day-icon.png" alt="TEK2day">
        <strong>TEK2day&nbsp;Finance</strong>
      </div>

      <div class="sidebar-body">
        <div class="section-title">Commands</div>
        <div class="fn-list">
          <button class="fn-item" type="button" data-template="/{symbol}"><span class="fn-code">/ticker</span><span class="fn-desc">Summary</span></button>
          <button class="fn-item" type="button" data-template="/{symbol} inc"><span class="fn-code">/ticker inc</span><span class="fn-desc">Income statement</span></button>
          <button class="fn-item" type="button" data-template="/{symbol} bal"><span class="fn-code">/ticker bal</span><span class="fn-desc">Balance sheet</span></button>
          <button class="fn-item" type="button" data-template="/{symbol} cf"><span class="fn-code">/ticker cf</span><span class="fn-desc">Cash flow</span></button>
          <button class="fn-item" type="button" data-template="/{symbol} mgmt"><span class="fn-code">/ticker mgmt</span><span class="fn-desc">Management / CEO</span></button>
          <button class="fn-item" type="button" data-template="/{symbol} filings"><span class="fn-code">/ticker filings</span><span class="fn-desc">SEC filings</span></button>
          <button class="fn-item" type="button" data-template="/{symbol} news"><span class="fn-code">/ticker news</span><span class="fn-desc">Recent news</span></button>
          <button class="fn-item" type="button" data-command="/comp AAPL MSFT"><span class="fn-code">/comp T1 T2</span><span class="fn-desc">Comp table</span></button>
          <button class="fn-item" type="button" data-command="/help"><span class="fn-code">/help</span><span class="fn-desc">Show commands</span></button>
        </div>

        <div class="section-title">Recent</div>
        <div class="fn-list" id="history"></div>
      </div>

      <div class="sidebar-foot">
        <span class="dot" id="status-dot"></span><span id="status-text">Ready</span>
        <a class="foot-link" href="/stocks">All&nbsp;Tickers</a>
      </div>
    </aside>

    <div class="scrim" id="scrim"></div>

    <main class="main">
      <header class="command-bar">
        <button class="icon-btn mobile-menu-btn" id="mobile-menu-btn" type="button" aria-label="Open commands"><span class="hamburger"></span></button>
        <form class="command-form" id="command-form">
          <span class="command-caret">&gt;</span>
          <input class="command-input" id="command-input" autocomplete="off" spellcheck="false" placeholder="/AAPL" aria-label="Command">
          <button class="go-btn" id="run-btn" type="submit" aria-label="Run command">&lt;GO&gt;</button>
        </form>
        <div class="command-label" id="terminal-command">Idle</div>
      </header>

      <div class="content" id="content"></div>

      <footer class="fnbar">
        <button class="fnkey" type="button" data-command="/help"><b>/help</b><span>Commands</span></button>
        <button class="fnkey" type="button" data-template="/{symbol}"><b>/ticker</b><span>Summary</span></button>
        <button class="fnkey" type="button" data-template="/{symbol} inc"><b>/ticker inc</b><span>Income</span></button>
        <button class="fnkey" type="button" data-template="/{symbol} news"><b>/ticker news</b><span>News</span></button>
        <button class="fnkey" type="button" data-command="/comp AAPL MSFT"><b>/comp</b><span>Compare</span></button>
        <span class="meta">TEK2DAY FINANCE TERMINAL</span>
      </footer>
    </main>
  </div>

  <script src="/static/lightweight-charts.standalone.production.js"></script>
  <script>
    const shell = document.getElementById("shell");
    const mobileMenuBtn = document.getElementById("mobile-menu-btn");
    const scrim = document.getElementById("scrim");
    const commandForm = document.getElementById("command-form");
    const commandInput = document.getElementById("command-input");
    const runBtn = document.getElementById("run-btn");
    const content = document.getElementById("content");
    const terminalCommand = document.getElementById("terminal-command");
    const statusText = document.getElementById("status-text");
    const statusDot = document.getElementById("status-dot");
    const historyEl = document.getElementById("history");

    let currentSymbol = "AAPL";
    let commandHistory = [];
    let runToken = 0;

    mobileMenuBtn.addEventListener("click", () => shell.classList.add("sidebar-open"));
    scrim.addEventListener("click", closeSidebar);

    commandForm.addEventListener("submit", (event) => {
      event.preventDefault();
      runCommand(commandInput.value.trim());
    });

    document.querySelectorAll("[data-command], [data-template]").forEach(bindCommandButton);

    function bindCommandButton(button) {
      button.addEventListener("click", () => {
        const activeSymbol = symbolFromCommand(commandInput.value) || currentSymbol || "AAPL";
        const command = button.dataset.command || button.dataset.template.replace("{symbol}", activeSymbol);
        commandInput.value = command;
        closeSidebar();
        runCommand(command);
      });
    }

    async function runCommand(rawCommand) {
      if (!rawCommand) return;
      const command = normalizeCommand(rawCommand);
      const symbol = symbolFromCommand(command);
      if (symbol) currentSymbol = symbol;

      const parts = command.slice(1).trim().split(/\s+/);
      const isBareTicker = Boolean(symbol) && parts.length === 1;

      commandInput.value = command;
      terminalCommand.textContent = command;
      runBtn.disabled = true;
      setStatus("Running", false);
      const token = ++runToken;

      try {
        if (isBareTicker) {
          await runDashboard(symbol, command, token);
        } else {
          await runSingle(command, token);
        }
      } finally {
        if (token === runToken) runBtn.disabled = false;
      }
    }

    async function fetchCommand(command) {
      const resp = await fetch("/api/command", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ command, width: terminalWidth() }),
      });
      return resp.json();
    }

    /* ───── dashboard: bare ticker fans out to 4 real commands ───── */

    async function runDashboard(symbol, command, token) {
      content.innerHTML = "";
      const grid = document.createElement("div");
      grid.className = "grid";
      const left = document.createElement("div");
      left.className = "col";
      const right = document.createElement("div");
      right.className = "col";
      grid.appendChild(left);
      grid.appendChild(right);
      content.appendChild(grid);

      const pSummary = makePanel(left, "Summary", command);
      const pEstimates = makePanel(left, "Estimates", command);
      const pIncome = makePanel(left, "Income Statement", `/${symbol} inc`);
      const pNews = makePanel(right, "Recent News", `/${symbol} news`);
      const pShort = makePanel(right, "Short Interest", command);
      const pFilings = makePanel(right, "SEC Filings", `/${symbol} filings`);

      addHistory(command);

      const tasks = [
        fetchCommand(command).then((result) => {
          if (token !== runToken) return;
          fillSummary(pSummary, result);
          fillEstimates(pEstimates, result);
          fillShortInterest(pShort, result);
          if (result.kind === "error") throw new Error(result.error || "error");
        }).catch((err) => {
          if (token !== runToken) return;
          panelError(pSummary, err);
          panelError(pEstimates, err);
          panelError(pShort, err);
          throw err;
        }),
        runPanelCommand(`/${symbol} inc`, pIncome, fillFinancials, token),
        runPanelCommand(`/${symbol} news`, pNews, fillNews, token),
        runPanelCommand(`/${symbol} filings`, pFilings, fillFilings, token),
      ];

      const results = await Promise.allSettled(tasks);
      if (token !== runToken) return;
      const failed = results.some((item) => item.status === "rejected");
      setStatus(failed ? "Error" : "Ready", failed);
    }

    async function runPanelCommand(command, panel, fill, token) {
      try {
        const result = await fetchCommand(command);
        if (token !== runToken) return;
        if (result.kind === "error") {
          panelError(panel, result.error || "Command failed.");
          throw new Error(result.error || "error");
        }
        fill(panel, result);
      } catch (err) {
        if (token === runToken && !panel.body.querySelector(".panel-error")) {
          panelError(panel, err);
        }
        throw err;
      }
    }

    /* ───── single command (subcommands, /comp, /help, errors) ───── */

    async function runSingle(command, token) {
      content.innerHTML = "";
      const single = document.createElement("div");
      single.className = "single";
      content.appendChild(single);

      let panel = null;
      try {
        const resultPromise = fetchCommand(command);
        panel = makePanel(single, titleForCommand(command), command);
        const result = await resultPromise;
        if (token !== runToken) return;

        if (result.kind === "error") {
          panelError(panel, result.error || "Command failed.");
          addHistory(result.command || command);
          setStatus("Error", true);
          return;
        }

        addHistory(result.command || command);

        if (result.kind === "help") {
          renderIdle();
          setStatus("Ready", false);
          return;
        }

        renderSingleResult(panel, result);
        setStatus("Ready", false);
      } catch (err) {
        if (token !== runToken) return;
        if (panel) panelError(panel, err);
        setStatus("Error", true);
      }
    }

    function renderSingleResult(panel, result) {
      const data = result.data;
      const type = data && data.type;

      if (result.kind === "summary" && data && data.overview) {
        fillSummary(panel, result);
        return;
      }
      if (type === "financials") {
        setPanelTitle(panel, data.title || titleForCommand(result.command), result.command);
        fillFinancials(panel, result);
        return;
      }
      if (type === "management") {
        setPanelTitle(panel, data.title || "Management", result.command);
        fillManagement(panel, result);
        return;
      }
      if (type === "filings") {
        fillFilings(panel, result);
        return;
      }
      if (type === "news") {
        fillNews(panel, result);
        return;
      }
      if (type === "compare") {
        fillCompare(panel, result);
        return;
      }
      fillPlainOutput(panel, result);
    }

    /* ───── panel helpers ───── */

    function makePanel(parent, title, crumb) {
      const root = document.createElement("section");
      root.className = "panel";
      const head = document.createElement("div");
      head.className = "panel-head";
      head.innerHTML = `<h2>${escapeHtml(title)}</h2><span class="crumb">${escapeHtml(crumb || "")}</span>`;
      const body = document.createElement("div");
      body.innerHTML = `<div class="panel-loading">Loading…</div>`;
      root.appendChild(head);
      root.appendChild(body);
      parent.appendChild(root);
      return { root, head, body };
    }

    function setPanelTitle(panel, title, crumb) {
      panel.head.innerHTML = `<h2>${escapeHtml(title)}</h2><span class="crumb">${escapeHtml(crumb || "")}</span>`;
    }

    function panelError(panel, err) {
      const message = err instanceof Error ? err.message : String(err || "Command failed.");
      panel.body.innerHTML = `<div class="panel-error">${escapeHtml(message)}</div>`;
    }

    function panelNote(panel, message) {
      panel.body.innerHTML = `<div class="panel-note">${escapeHtml(message)}</div>`;
    }

    function valueMarkup(value) {
      const text = String(value === null || value === undefined ? "" : value);
      if (/^\+\d/.test(text)) return `<span class="up">${escapeHtml(text)}</span>`;
      if (/^-\d/.test(text)) return `<span class="down">${escapeHtml(text)}</span>`;
      return escapeHtml(text);
    }

    function metricGridHtml(metrics) {
      return `<div class="metric-grid">${(metrics || []).map((metric) => `
        <div class="metric">
          <span>${escapeHtml(metric.label)}</span>
          <strong>${valueMarkup(metric.value === null || metric.value === undefined || metric.value === "" ? "N/A" : metric.value)}</strong>
        </div>`).join("")}</div>`;
    }

    function matrixTableHtml(section) {
      const periods = section.periods || [];
      return `<div class="table-scroll"><table>
        <thead><tr><th>Metric</th>${periods.map((period) => `<th>${escapeHtml(period)}</th>`).join("")}</tr></thead>
        <tbody>${(section.rows || []).map((row) => `
          <tr><td>${escapeHtml(row.label)}</td>${(row.values || []).map((value) => `<td>${valueMarkup(value)}</td>`).join("")}</tr>`).join("")}
        </tbody>
      </table></div>`;
    }

    function sourceLineHtml(text) {
      return text ? `<div class="source-line">${escapeHtml(text)}</div>` : "";
    }

    /* ───── fill functions (one per data shape) ───── */

    function fillSummary(panel, result) {
      const data = result.data || {};
      const overview = data.overview;
      if (!overview) {
        fillPlainOutput(panel, result);
        return;
      }

      const change = Number(overview.change || 0);
      const hasChange = overview.change !== null && overview.change !== undefined
        && overview.change_pct !== null && overview.change_pct !== undefined;
      const changeClass = change >= 0 ? "up" : "down";
      const changeText = hasChange
        ? `${change > 0 ? "+" : ""}${change.toFixed(2)} (${Number(overview.change_pct) > 0 ? "+" : ""}${Number(overview.change_pct).toFixed(2)}%)`
        : "N/A";

      panel.body.innerHTML = `
        <div class="quote-strip">
          <div class="quote-name">
            <h1>${escapeHtml(overview.name || overview.symbol || "Summary")}</h1>
            <span>${escapeHtml(overview.symbol || "")}</span>
          </div>
          <div class="quote-px">
            <span class="last">${escapeHtml(overview.price || "N/A")}</span>
            <span class="chg ${changeClass}">${escapeHtml(changeText)}</span>
            <span class="vol">VOL ${escapeHtml(overview.volume || "N/A")}</span>
          </div>
        </div>
        ${metricGridHtml(overview.metrics)}
        ${overview.description ? `<p class="description">${escapeHtml(overview.description)}</p>` : ""}
        ${sourceLineHtml(`Source: ${overview.source || "Yahoo Finance, TEK2day"}`)}
      `;
      mountChart(panel, overview.symbol || "AAPL");
    }

    function fillEstimates(panel, result) {
      const estimates = result.data && result.data.estimates;
      if (!estimates || !Array.isArray(estimates.sections) || !estimates.sections.length) {
        panelNote(panel, "No estimate data.");
        return;
      }
      panel.body.innerHTML = estimates.sections.map((section, index) => `
        ${estimates.sections.length > 1 ? `<div class="sub-title">${escapeHtml(section.title || `Section ${index + 1}`)}</div>` : ""}
        ${matrixTableHtml(section)}
      `).join("") + sourceLineHtml(`As of ${estimates.asOf || "unknown"} | Source: ${estimates.source || "Yahoo Finance, TEK2day"}`);
    }

    function fillShortInterest(panel, result) {
      const shortInterest = result.data && result.data.shortInterest;
      if (!shortInterest) {
        panelNote(panel, "No short interest data.");
        return;
      }
      panel.body.innerHTML = metricGridHtml(shortInterest.metrics)
        + sourceLineHtml(`Source: ${shortInterest.source || "Yahoo Finance, TEK2day"}`);
    }

    function fillFinancials(panel, result) {
      const data = result.data;
      if (!data || !Array.isArray(data.sections) || !data.sections.length) {
        fillPlainOutput(panel, result);
        return;
      }
      panel.body.innerHTML = data.sections.map((section, index) => `
        ${data.sections.length > 1 ? `<div class="sub-title">${escapeHtml(section.title || `Section ${index + 1}`)}</div>` : ""}
        ${matrixTableHtml(section)}
      `).join("") + sourceLineHtml(`Source: ${data.source || "Yahoo Finance, TEK2day"}`);
    }

    function fillManagement(panel, result) {
      const data = result.data || {};
      if (Array.isArray(data.leaders) && data.leaders.length) {
        panel.body.innerHTML = data.leaders.map((leader, index) => {
          const metrics = leader.metrics || [];
          const ceo = metrics.find((metric) => metric.label === "CEO");
          const rest = metrics.filter((metric) => metric.label !== "CEO");
          return `
            <div class="sub-title">${escapeHtml((ceo && ceo.value) || `Leader ${index + 1}`)}</div>
            ${metricGridHtml(rest)}
          `;
        }).join("") + sourceLineHtml(`Source: ${data.source || "Yahoo Finance, TEK2day"}`);
        return;
      }
      if (Array.isArray(data.officers) && data.officers.length) {
        panel.body.innerHTML = `<div class="table-scroll"><table>
          <thead><tr><th class="cell-left">Name</th><th class="cell-left">Title</th><th>Age</th><th>Total Pay</th></tr></thead>
          <tbody>${data.officers.map((officer) => `
            <tr>
              <td class="cell-left">${escapeHtml(officer.name || "")}</td>
              <td class="cell-left">${escapeHtml(officer.title || "")}</td>
              <td>${escapeHtml(officer.age || "")}</td>
              <td>${escapeHtml(officer.totalPay || "")}</td>
            </tr>`).join("")}
          </tbody>
        </table></div>` + sourceLineHtml(`Source: ${data.source || "Yahoo Finance, TEK2day"}`);
        return;
      }
      fillPlainOutput(panel, result);
    }

    function fillNews(panel, result) {
      const items = (result.data && result.data.items) || [];
      if (!items.length) {
        panelNote(panel, "No recent news.");
        return;
      }
      const list = document.createElement("div");
      list.className = "news-list";
      items.forEach((item) => {
        const tag = item.url ? "a" : "div";
        const node = document.createElement(tag);
        node.className = "news-item";
        if (item.url) {
          node.href = item.url;
          node.target = "_blank";
          node.rel = "noopener";
        }
        node.innerHTML = `
          <span class="news-title">${escapeHtml(item.title || "Untitled")}</span>
          <span class="news-meta">${escapeHtml([item.publisher, item.date].filter(Boolean).join(" | "))}</span>
        `;
        list.appendChild(node);
      });
      panel.body.innerHTML = "";
      panel.body.appendChild(list);
      panel.body.insertAdjacentHTML("beforeend", sourceLineHtml(`Source: ${(result.data && result.data.source) || "Yahoo Finance"}`));
    }

    function fillFilings(panel, result) {
      const filings = (result.data && result.data.filings) || [];
      if (!filings.length) {
        panelNote(panel, "No filings found.");
        return;
      }
      panel.body.innerHTML = `<div class="table-scroll"><table>
        <thead><tr><th class="cell-left">Date</th><th class="cell-left">Form</th><th class="cell-left">Description</th><th>Accession</th></tr></thead>
        <tbody>${filings.map((filing) => {
          const description = filing.url
            ? `<a href="${escapeHtml(filing.url)}" target="_blank" rel="noopener">${escapeHtml(filing.description || "Filing")}</a>`
            : escapeHtml(filing.description || "");
          const accession = `<code>${escapeHtml(filing.accession || "")}</code>`;
          return `
            <tr>
              <td class="cell-left">${escapeHtml(filing.date || "")}</td>
              <td class="cell-left">${escapeHtml(filing.form || "")}</td>
              <td class="cell-left">${description}</td>
              <td>${filing.url ? `<a href="${escapeHtml(filing.url)}" target="_blank" rel="noopener">${accession}</a>` : accession}</td>
            </tr>`;
        }).join("")}
        </tbody>
      </table></div>` + sourceLineHtml(`Source: ${(result.data && result.data.source) || "SEC EDGAR"}`);
    }

    function fillCompare(panel, result) {
      const data = result.data;
      if (!data || !Array.isArray(data.rows) || !data.rows.length) {
        fillPlainOutput(panel, result);
        return;
      }
      const symbols = (data.symbols || []).map((item) => item.symbol);
      setPanelTitle(panel, data.title || "Comp Table", symbols.join(" vs ") || result.command);
      panel.body.innerHTML = matrixTableHtml({ periods: symbols, rows: data.rows })
        + sourceLineHtml(`Source: ${data.source || "Yahoo Finance, TEK2day"}`);
    }

    function fillPlainOutput(panel, result) {
      const text = result.output || result.error || "No output.";
      panel.body.innerHTML = "";
      const wrapper = document.createElement("div");
      wrapper.className = "output-block";
      const pre = document.createElement("pre");
      pre.textContent = String(text);
      wrapper.appendChild(pre);
      panel.body.appendChild(wrapper);
    }

    /* ───── price chart (ported from approved terminal_chart_preview.py) ───── */

    const priceCache = new Map();

    async function fetchPrices(symbol) {
      if (priceCache.has(symbol)) return priceCache.get(symbol);
      const resp = await fetch(`/api/prices/${encodeURIComponent(symbol)}?limit=1260`);
      if (!resp.ok) throw new Error(`prices ${resp.status}`);
      const raw = await resp.json();
      const rows = (Array.isArray(raw) ? raw : []).filter((r) => r && r.time && r.close != null);
      priceCache.set(symbol, rows);
      return rows;
    }

    async function mountChart(panel, symbol) {
      const strip = panel.body.querySelector(".quote-strip");
      if (!strip) return;
      const wrap = document.createElement("div");
      wrap.className = "chart-wrap";
      wrap.innerHTML = `<div class="panel-loading">Loading chart…</div>`;
      strip.insertAdjacentElement("afterend", wrap);

      let rows = null;
      try { rows = await fetchPrices(symbol); } catch (err) { rows = null; }
      if (!wrap.isConnected) return;
      if (!rows || rows.length < 30) {
        wrap.innerHTML = `<div class="panel-note">No price history available.</div>`;
        return;
      }
      renderChart(wrap, rows);
    }

    function renderChart(wrap, RAW) {
      wrap.innerHTML = `
        <div class="chart-readout"></div>
        <div class="chart-el"></div>
        <div class="chart-ranges"></div>
      `;
      const readoutEl = wrap.querySelector(".chart-readout");
      const chartEl = wrap.querySelector(".chart-el");
      const rangesEl = wrap.querySelector(".chart-ranges");

      const byTime = new Map(RAW.map((r) => [r.time, r]));
      const lastRow = RAW[RAW.length - 1];

      const fmt = (n) => n == null ? "—" : n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const fmtVol = (n) => n == null ? "—" : n >= 1e9 ? (n / 1e9).toFixed(2) + "B" : n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n.toLocaleString();

      const chart = LightweightCharts.createChart(chartEl, {
        autoSize: true,
        layout: {
          background: { color: "#070705" },
          textColor: "#8a8878",
          fontFamily: '"IBM Plex Mono", Consolas, monospace',
          fontSize: 11,
        },
        grid: {
          vertLines: { color: "#14130e" },
          horzLines: { color: "#14130e" },
        },
        crosshair: {
          mode: LightweightCharts.CrosshairMode.Magnet,
          vertLine: { color: "#8a8878", labelBackgroundColor: "#ff9f1c" },
          horzLine: { color: "#8a8878", labelBackgroundColor: "#ff9f1c" },
        },
        rightPriceScale: { borderColor: "#1c1b14" },
        timeScale: { borderColor: "#1c1b14", timeVisible: false },
        // Drag-pan and scroll-zoom are intentionally disabled:
        handleScroll: false,
        handleScale: false,
        kineticScroll: { touch: false, mouse: false },
      });

      const area = chart.addAreaSeries({
        lineColor: "#ff9f1c",
        topColor: "rgba(255, 159, 28, 0.20)",
        bottomColor: "rgba(255, 159, 28, 0)",
        lineWidth: 2,
        priceLineVisible: false,
        lastValueVisible: true,
      });
      area.setData(RAW.map((r) => ({ time: r.time, value: r.close })));

      const vol = chart.addHistogramSeries({
        priceScaleId: "",
        priceFormat: { type: "volume" },
        lastValueVisible: false,
        priceLineVisible: false,
      });
      chart.priceScale("").applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });
      vol.setData(RAW.map((r, i) => ({
        time: r.time,
        value: r.volume || 0,
        color: (i > 0 && r.close >= RAW[i - 1].close) ? "rgba(47, 212, 127, 0.55)" : "rgba(255, 77, 66, 0.55)",
      })));

      function showRow(r) {
        if (!r) { readoutEl.innerHTML = ""; return; }
        readoutEl.innerHTML =
          `${r.time} &nbsp; O:<b>${fmt(r.open)}</b> H:<b>${fmt(r.high)}</b> L:<b>${fmt(r.low)}</b> C:<b>${fmt(r.close)}</b> V:<b>${fmtVol(r.volume)}</b>`;
      }
      showRow(lastRow);
      chart.subscribeCrosshairMove((p) => {
        if (p.time) { showRow(byTime.get(p.time)); } else { showRow(lastRow); }
      });

      const last = new Date(lastRow.time);
      function monthsBack(m) {
        const d = new Date(last);
        d.setMonth(d.getMonth() - m);
        return d.toISOString().slice(0, 10);
      }
      const RANGES = [
        ["1M", () => monthsBack(1)],
        ["3M", () => monthsBack(3)],
        ["6M", () => monthsBack(6)],
        ["YTD", () => `${last.getFullYear()}-01-01`],
        ["1Y", () => monthsBack(12)],
        ["5Y", () => RAW[0].time],
      ];
      RANGES.forEach(([label, fromFn]) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = label;
        button.onclick = () => {
          chart.timeScale().setVisibleRange({ from: fromFn(), to: lastRow.time });
          rangesEl.querySelectorAll("button").forEach((other) => other.classList.remove("active"));
          button.classList.add("active");
        };
        rangesEl.appendChild(button);
      });
      // Default: 6M
      rangesEl.children[2].click();
    }

    /* ───── idle state ───── */

    function renderIdle() {
      content.innerHTML = `
        <div class="idle-wrap">
          <div class="idle">
            <img src="/static/tek2day-icon.png" alt="">
            <div>
              <h1>TEK2day Finance Terminal</h1>
              <div class="hint">Type a command to begin &nbsp;·&nbsp; e.g. <code>/AAPL</code></div>
            </div>
            <div class="chips">
              <button class="chip" type="button" data-command="/AAPL">/AAPL<span>Summary</span></button>
              <button class="chip" type="button" data-command="/MSFT inc">/MSFT inc<span>Income</span></button>
              <button class="chip" type="button" data-command="/NVDA news">/NVDA news<span>News</span></button>
              <button class="chip" type="button" data-command="/comp AAPL MSFT">/comp AAPL MSFT<span>Compare</span></button>
              <button class="chip" type="button" data-command="/help">/help<span>Commands</span></button>
            </div>
          </div>
        </div>
      `;
      content.querySelectorAll(".chip").forEach(bindCommandButton);
    }

    /* ───── utilities (same behavior as before) ───── */

    function normalizeCommand(rawCommand) {
      let command = rawCommand.trim();
      if (!command.startsWith("/")) command = `/${command}`;
      const parts = command.slice(1).split(/\s+/);
      if (parts[0] && parts[0].toLowerCase() === "ticker") {
        parts[0] = currentSymbol || "AAPL";
        command = `/${parts.join(" ")}`;
      }
      return command;
    }

    function terminalWidth() {
      if (window.matchMedia("(max-width: 760px)").matches) {
        const cols = Math.floor((content.clientWidth || 360) / 8.2);
        return Math.max(44, Math.min(64, cols));
      }
      const cols = Math.floor((content.clientWidth || 720) / 7);
      return Math.max(72, Math.min(132, cols));
    }

    function symbolFromCommand(command) {
      const parts = command.replace(/^\//, "").trim().split(/\s+/);
      if (!parts[0] || ["help", "exit", "quit", "q", "comp"].includes(parts[0].toLowerCase())) return null;
      return parts[0].toUpperCase();
    }

    function titleForCommand(command) {
      const parts = command.replace(/^\//, "").trim().split(/\s+/);
      const sub = (parts[1] || "").toLowerCase();
      const titles = {
        inc: "Income Statement",
        bal: "Balance Sheet",
        cf: "Cash Flow",
        mgmt: "Management",
        filings: "SEC Filings",
        news: "Recent News",
      };
      if (parts[0] && parts[0].toLowerCase() === "comp") return "Comp Table";
      return titles[sub] || "Output";
    }

    function addHistory(command) {
      commandHistory = [command, ...commandHistory.filter((item) => item !== command)].slice(0, 8);
      historyEl.innerHTML = commandHistory.map((item) => (
        `<button class="fn-item" type="button"><span class="fn-code">${escapeHtml(item)}</span><span class="fn-desc">Recent</span></button>`
      )).join("");
      historyEl.querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", () => {
          const command = button.querySelector(".fn-code").textContent;
          commandInput.value = command;
          closeSidebar();
          runCommand(command);
        });
      });
    }

    function closeSidebar() {
      shell.classList.remove("sidebar-open");
    }

    function setStatus(text, isError) {
      statusText.textContent = text;
      statusDot.classList.toggle("error", Boolean(isError));
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    renderIdle();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      });
    }

    /* Deep link: /?t=AAPL runs that ticker on load (used by the SEO tear sheets). */
    const deepLinkSymbol = new URLSearchParams(window.location.search).get("t");
    if (deepLinkSymbol && /^[A-Za-z][A-Za-z0-9.\-]{0,12}$/.test(deepLinkSymbol)) {
      runCommand("/" + deepLinkSymbol.toUpperCase());
    }
  </script>
</body>
</html>
