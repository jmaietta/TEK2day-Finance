<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TEK2day Finance - Terminal GUI</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #000;
      --panel: #050505;
      --panel-2: #0a0a0a;
      --line: #171717;
      --line-2: #242424;
      --text: #e5e7eb;
      --muted: #7a7a7a;
      --dim: #4b5563;
      --blue: #2563eb;
      --blue-2: #3b82f6;
      --green: #4ade80;
      --red: #f87171;
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "DM Sans", system-ui, sans-serif;
      overflow: hidden;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }

    .shell {
      display: grid;
      grid-template-rows: 58px 1fr;
      height: 100vh;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
      background: #000;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 220px;
    }

    .brand img {
      width: 30px;
      height: 30px;
      border-radius: 6px;
    }

    .brand-title {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }

    .brand-title strong {
      color: #fff;
      font-size: 15px;
      font-weight: 700;
    }

    .brand-title span {
      color: var(--muted);
      font-size: 11px;
      margin-top: 3px;
    }

    .command-form {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 10px;
      width: min(780px, 58vw);
    }

    .command-input {
      width: 100%;
      height: 38px;
      border: 1px solid var(--line-2);
      border-radius: var(--radius);
      background: #080808;
      color: #fff;
      font-family: "Fira Code", Consolas, monospace;
      font-size: 13px;
      outline: none;
      padding: 0 14px;
    }

    .command-input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 1px rgba(37, 99, 235, 0.2);
    }

    .run-btn {
      min-width: 76px;
      height: 38px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background: var(--blue);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }

    .run-btn:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-family: "Fira Code", Consolas, monospace;
      font-size: 11px;
      min-width: 96px;
      text-transform: uppercase;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--green);
      box-shadow: 0 0 14px rgba(74, 222, 128, 0.45);
    }

    .workspace {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      min-height: 0;
    }

    .rail,
    .terminal-pane {
      min-height: 0;
      border-right: 1px solid var(--line);
      background: #000;
    }

    .rail {
      display: flex;
      flex-direction: column;
      background: #020202;
    }

    .rail-section {
      padding: 16px;
      border-bottom: 1px solid var(--line);
    }

    .section-title {
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .command-list {
      display: grid;
      gap: 8px;
    }

    .command-card {
      display: grid;
      grid-template-columns: 140px 1fr;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 42px;
      border: 1px solid #151515;
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--text);
      text-align: left;
      padding: 9px 10px;
    }

    .command-card:hover {
      border-color: var(--blue-2);
      background: #080808;
    }

    .command-card code {
      color: #fff;
      font-family: "Fira Code", Consolas, monospace;
      font-size: 11px;
    }

    .command-card span {
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .terminal-pane {
      display: flex;
      flex-direction: column;
      border-right: 0;
    }

    .pane-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      height: 48px;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
      background: #000;
    }

    .pane-title {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .pane-title strong {
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }

    .pane-title span {
      overflow: hidden;
      color: var(--muted);
      font-family: "Fira Code", Consolas, monospace;
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .copy-btn {
      height: 30px;
      border: 1px solid var(--line-2);
      border-radius: 7px;
      background: #080808;
      color: var(--muted);
      padding: 0 10px;
      font-size: 12px;
    }

    .copy-btn:hover {
      color: #fff;
      border-color: var(--blue-2);
    }

    .terminal-output {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 16px;
      background: #000;
      color: #d6d6d6;
      display: grid;
      align-content: start;
      gap: 12px;
    }

    .output-block {
      overflow: auto;
      border: 1px solid #151515;
      border-radius: var(--radius);
      background: var(--panel);
      padding: 12px;
    }

    .output-block pre {
      color: inherit;
      font-family: "Fira Code", Consolas, monospace;
      font-size: 12px;
      line-height: 1.45;
      white-space: pre;
    }

    .terminal-output.empty {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      text-align: center;
    }

    .terminal-output.error { color: var(--red); }

    .history {
      display: grid;
      gap: 8px;
    }

    .history button {
      width: 100%;
      border: 1px solid #151515;
      border-radius: var(--radius);
      background: var(--panel);
      color: #cbd5e1;
      padding: 8px 10px;
      text-align: left;
      font-family: "Fira Code", Consolas, monospace;
      font-size: 11px;
    }

    @media (max-width: 1100px) {
      body { overflow: auto; }
      .shell { height: auto; min-height: 100vh; }
      .command-form { width: min(620px, 52vw); }
    }

    @media (max-width: 760px) {
      .topbar {
        height: auto;
        min-height: 58px;
        flex-direction: column;
        align-items: stretch;
        padding: 12px;
      }
      .command-form { width: 100%; }
      .status { display: none; }
      .workspace { grid-template-columns: 1fr; }
      .terminal-pane {
        order: 1;
        min-height: calc(100vh - 128px);
        border-right: 0;
      }
      .rail {
        order: 2;
        border-right: 0;
      }
      .terminal-output {
        padding: 10px;
        gap: 10px;
      }
      .output-block {
        padding: 10px;
      }
      .output-block pre {
        font-size: 11px;
      }
      .pane-head {
        height: 42px;
        padding: 0 10px;
      }
      .command-card {
        grid-template-columns: 132px 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <img src="/static/tek2day-icon.png" alt="TEK2day">
        <div class="brand-title">
          <strong>TEK2day Finance</strong>
          <span>Terminal GUI</span>
        </div>
      </div>

      <form class="command-form" id="command-form">
        <input class="command-input" id="command-input" autocomplete="off" spellcheck="false" value="/AAPL" aria-label="Command">
        <button class="run-btn" id="run-btn" type="submit">Run</button>
      </form>

      <div class="status"><span class="status-dot"></span><span id="status-text">Ready</span></div>
    </header>

    <main class="workspace">
      <aside class="rail">
        <section class="rail-section">
          <div class="section-title">Command Menu</div>
          <div class="command-list">
            <button class="command-card" data-template="/{symbol}"><code>/ticker</code><span>Summary</span></button>
            <button class="command-card" data-template="/{symbol} inc"><code>/ticker inc</code><span>Income statement</span></button>
            <button class="command-card" data-template="/{symbol} bal"><code>/ticker bal</code><span>Balance sheet</span></button>
            <button class="command-card" data-template="/{symbol} cf"><code>/ticker cf</code><span>Cash flow</span></button>
            <button class="command-card" data-template="/{symbol} mgmt"><code>/ticker mgmt</code><span>Management / CEO</span></button>
            <button class="command-card" data-template="/{symbol} filings"><code>/ticker filings</code><span>SEC filings</span></button>
            <button class="command-card" data-template="/{symbol} news"><code>/ticker news</code><span>Recent news</span></button>
            <button class="command-card" data-command="/comp AAPL MSFT"><code>/comp TICKER1 TICKER2</code><span>Comp table</span></button>
            <button class="command-card" data-command="/help"><code>/help</code><span>Show this menu</span></button>
            <button class="command-card" data-command="/exit"><code>/exit</code><span>Quit</span></button>
          </div>
        </section>

        <section class="rail-section">
          <div class="section-title">Recent</div>
          <div class="history" id="history"></div>
        </section>
      </aside>

      <section class="terminal-pane">
        <div class="pane-head">
          <div class="pane-title">
            <strong>Output</strong>
            <span id="terminal-command">Idle</span>
          </div>
          <button class="copy-btn" id="copy-btn" type="button">Copy</button>
        </div>
        <div class="terminal-output empty" id="terminal-output">Enter a command or choose one from the menu.</div>
      </section>
    </main>
  </div>

  <script>
    const commandForm = document.getElementById("command-form");
    const commandInput = document.getElementById("command-input");
    const runBtn = document.getElementById("run-btn");
    const terminalOutput = document.getElementById("terminal-output");
    const terminalCommand = document.getElementById("terminal-command");
    const statusText = document.getElementById("status-text");
    const historyEl = document.getElementById("history");

    let currentSymbol = "AAPL";
    let commandHistory = [];
    let terminalPlainText = "";

    commandForm.addEventListener("submit", (event) => {
      event.preventDefault();
      runCommand(commandInput.value.trim());
    });

    document.querySelectorAll(".command-card").forEach((button) => {
      button.addEventListener("click", () => {
        const activeSymbol = symbolFromCommand(commandInput.value) || currentSymbol || "AAPL";
        const command = button.dataset.command || button.dataset.template.replace("{symbol}", activeSymbol);
        commandInput.value = command;
        runCommand(command);
      });
    });

    document.getElementById("copy-btn").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(terminalPlainText || terminalOutput.textContent || "");
        setStatus("Copied");
      } catch (err) {
        setStatus("Copy failed");
      }
    });

    async function runCommand(rawCommand) {
      if (!rawCommand) return;
      const command = normalizeCommand(rawCommand);
      const symbol = symbolFromCommand(command);
      if (symbol) {
        currentSymbol = symbol;
      }

      commandInput.value = command;
      terminalCommand.textContent = command;
      terminalOutput.classList.remove("empty", "error");
      terminalOutput.textContent = "Running...";
      terminalPlainText = "Running...";
      runBtn.disabled = true;
      setStatus("Running");

      try {
        const resp = await fetch("/api/command", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ command, width: terminalWidth() }),
        });
        const result = await resp.json();
        terminalPlainText = result.output || result.error || "No output.";
        renderOutput(terminalPlainText);
        terminalOutput.classList.toggle("error", result.kind === "error");
        addHistory(result.command || command);
        setStatus(result.kind === "error" ? "Error" : "Ready");
      } catch (err) {
        terminalPlainText = `Command failed: ${err}`;
        renderOutput(terminalPlainText);
        terminalOutput.classList.add("error");
        setStatus("Error");
      } finally {
        runBtn.disabled = false;
      }
    }

    function normalizeCommand(rawCommand) {
      let command = rawCommand.trim();
      if (!command.startsWith("/")) command = `/${command}`;
      const parts = command.slice(1).split(/\s+/);
      if (parts[0] && parts[0].toLowerCase() === "ticker") {
        parts[0] = currentSymbol || "AAPL";
        command = `/${parts.join(" ")}`;
      }
      return command;
    }

    function terminalWidth() {
      const cols = Math.floor((terminalOutput.clientWidth || 720) / 7);
      return Math.max(72, Math.min(132, cols));
    }

    function symbolFromCommand(command) {
      const parts = command.replace(/^\//, "").trim().split(/\s+/);
      if (!parts[0] || ["help", "exit", "quit", "q", "comp"].includes(parts[0].toLowerCase())) return null;
      return parts[0].toUpperCase();
    }

    function addHistory(command) {
      commandHistory = [command, ...commandHistory.filter((item) => item !== command)].slice(0, 8);
      historyEl.innerHTML = commandHistory.map((item) => `<button type="button">${escapeHtml(item)}</button>`).join("");
      historyEl.querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", () => {
          commandInput.value = button.textContent;
          runCommand(button.textContent);
        });
      });
    }

    function setStatus(text) {
      statusText.textContent = text;
    }

    function renderOutput(text) {
      terminalOutput.classList.remove("empty");
      terminalOutput.innerHTML = "";
      const wrapper = document.createElement("div");
      wrapper.className = "output-block";
      const pre = document.createElement("pre");
      pre.textContent = String(text || "No output.");
      wrapper.appendChild(pre);
      terminalOutput.appendChild(wrapper);
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    addHistory("/help");
  </script>
</body>
</html>
