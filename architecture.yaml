# THE TEK2day ARCHITECTURE, AS FACTS THAT CAN BE CHECKED.
#
# ⚠️ THIS FILE IS NOT DOCUMENTATION. It is an assertion about reality that
# `architecture_check.py` verifies against the live Google Cloud project and
# against this repo. If they disagree, the check fails and an email is sent.
#
# WHY IT EXISTS: the same architectural facts were re-derived, badly, across a
# whole session on 19-20 Aug 2026 — how many images there are, which workflow
# builds them, whether a repair job exists, why a build ran twice. His words:
# "I had really hoped that you would know my TEK2day and Kilby repos inside and
# out by now... So much time wasted reviewing the same things over and over."
#
# ⚠️ A STALE MAP IS WORSE THAN NO MAP — it is confidently wrong, and it will be
# believed. The `deploy-jobs.yml` comment that misled an entire investigation on
# 19 Aug was accurate when written. That is why this file is CHECKED, not
# trusted.
#
# WHEN SOMETHING CHANGES ON PURPOSE: update this file in the same commit. The
# check failing is the point — it means reality moved and nobody said so.

project: yfinance-cli
region: us-central1
registry: us-central1-docker.pkg.dev/yfinance-cli/tek2day

# ── containers ───────────────────────────────────────────────────────────────
# Five Dockerfiles, FOUR images. The fifth is dead scaffolding, kept only
# because deleting it is a decision nobody has made.
dockerfiles:
  Dockerfile.api:                   {image: api,                  built_by: deploy-api.yml}
  Dockerfile.daily-prices:          {image: daily-prices,         built_by: deploy-jobs.yml}
  Dockerfile.weekly-estimates:      {image: weekly-estimates,     built_by: deploy-jobs.yml}
  Dockerfile.quarterly-financials:  {image: quarterly-financials, built_by: deploy-jobs.yml}
  Dockerfile.repair-proposals:      {image: null,                 built_by: null,
                                     note: "NEVER BUILT. repair_financials.py --scan was
                                            containerised and never deployed. There is NO
                                            separate repair job - the repair that fills
                                            ORCL's blank column runs INSIDE
                                            pull_quarterly_financials.py via
                                            proposals.is_stub."}

# ── scheduled work ───────────────────────────────────────────────────────────
cloud_run_jobs:
  daily-price-pull:
    image: daily-prices
    tag: latest
    task_count: 6
    max_retries: 0        # ⚠️ 0 ON PURPOSE (19 Aug). Exiting non-zero with retries
                          # enabled would make a failing night hit Yahoo TWICE
                          # (~19,800 requests). "I don't want it to auto-run as I
                          # do not want Yahoo to throttle us." DO NOT RAISE THIS.
  weekly-estimate-pull:
    image: weekly-estimates
    tag: latest
    task_count: 1
    max_retries: 1
  quarterly-financial-pull:
    image: quarterly-financials
    tag: latest
    task_count: 1
    max_retries: 1
  architecture-check:
    image: daily-prices          # reuses an existing image, no new Dockerfile
    tag: latest
    task_count: 1
    max_retries: 0               # a drift report is not worth a second run
    note: "Runs architecture_check.py daily via Cloud Scheduler. Overrides the
           image's entrypoint rather than building anything new. The repo files
           it needs are NOT in the image (COPY *.py only), so it fetches them
           from the public repo; if GitHub is unreachable those checks are
           SKIPPED, never reported as drift, so an outage cannot email at 3am."

  full-data-pull-v2:
    image: full-onboard
    tag: v2-fixed
    note: "A ONE-TIME JOB FROM THE INITIAL TEK2day BUILD (his words). Pinned to a
           hand-made tag, built from no Dockerfile in this repo. NOT part of the
           running pipeline and cannot pick up code changes. Left alone."

# ── who builds ───────────────────────────────────────────────────────────────
# ⚠️ ONE BUILD SYSTEM. Until 20 Aug 2026 GitHub Actions AND four Cloud Build
# triggers both fired on every push, both pushed the same :latest tag, and
# whichever finished last won. The data jobs resolve :latest at EXECUTION time,
# so the nightly pull ran whichever won the race - and before requirements.txt
# was pinned the two builds could resolve DIFFERENT package versions.
build_authority: github-actions
cloud_build_triggers_must_be_disabled:
  - tek2day-api
  - build-daily-prices
  - build-weekly-estimates
  - build-quarterly-financials

# ── dependency safety ────────────────────────────────────────────────────────
# Every package pinned exactly. `yfinance>=0.2.31` with no pandas or numpy at all
# is how a rebuild on 13 Aug 2026 left the price pull failing on all 9,911
# tickers for a week.
requirements_must_be_fully_pinned: true

# GitHub actions pinned to commit SHAs so a maintainer cannot repoint a tag.
# ⚠️ Does NOT protect against GitHub retiring a runner runtime - the runs already
# log "Node 20 is being deprecated". That is what broke TEK2day Pulse.
github_actions_must_be_sha_pinned: true

# ── the macro data layer: A SEPARATE REPO AND A SEPARATE GCP PROJECT ─────────
# ⚠️ NOT COVERED BY architecture_check.py. That checker reads the yfinance-cli
# project only. This section is documentation, verified by hand on 20 Aug 2026.
#
# ⚠️ THE SEPARATION IS DELIBERATE AND IS ABOUT WRITE ACCESS, not tidiness:
# "Safer than putting macro data in the existing finance Firestore because macro
# ingestion jobs cannot overwrite existing ticker/watchlist/session datasets."
# The macro service account has NO access to the finance Firestore.
macro:
  repo: jmaietta/TEK2day-Macro-Data      # private; clone at C:/Users/jmaie/TEK2day-Macro-Data
  gcp_project: macro-data-222cd          # project number 187056798094
  firestore_doc: macro_snapshots/current # ONE document, 6 sections, 24 rows, served whole
  cloud_run_job: tek2day-macro-refresh
  build: cloudbuild.yaml, tagged by commit SHA, and it DEPLOYS the job
  trigger: tek2day-macro-deploy-main     # created 22 Jun 2026; ONE trigger - see gotchas
  build_service_account: macro-cloud-build-deploy@macro-data-222cd
  runtime_service_account: macro-refresh-runtime@macro-data-222cd
  alerts:
    - "TEK2day macro: daily refresh job failed"   # -> jmaietta@tek2day.com
    - "TEK2day macro: Cloud Build failed"         # -> jmaietta@tek2day.com

  # ⚠️ THINGS THAT COST TIME ON 20 AUG 2026. Read before touching this repo.
  gotchas:
    - "TESTS ARE unittest, NOT pytest. CI runs `python -m unittest discover -s tests`
       and pytest is NOT installed on the runner. Pytest-style tests pass locally
       and fail CI."
    - "BUILDS ARE REGIONAL (us-central1). `gcloud builds list` without --region
       shows an EMPTY list and looks like nothing ran."
    - "`gcloud builds submit` runs as the DEFAULT COMPUTE account, which has no
       Cloud Run permission, and uploads a tarball the deploy account cannot read.
       Let the TRIGGER build; do not submit by hand."
    - "SHORT_SHA is only populated by a trigger. A manual submit produces an empty
       image tag and fails with 'could not parse reference'."
    - "⚠️ CORRECTED 21 Aug 2026. This entry used to read 'until 20 Aug there was
       NO trigger; the pipeline existed, nothing invoked it, and the job ran a
       22 June image for two months.' THAT WAS WRONG. Trigger
       tek2day-macro-deploy-main was created 22 Jun 2026 at 08:01 UTC and fired
       the SAME DAY (builds c7cb286 at 08:08, 655c9ae at 14:19, both SUCCESS).
       There were then ZERO commits to main between 22 Jun and 20 Aug. The job
       ran a 22 June image because THE CODE WAS FROM 22 JUNE. Acting on the wrong
       diagnosis, a second trigger (macro-refresh-deploy) was created on 20 Aug,
       so every push built and deployed TWICE until it was deleted 21 Aug.
       An old image is not proof that a pipeline is broken - check for commits."
    - "The surviving trigger has an includedFiles filter (Dockerfile,
       pyproject.toml, src/**, jobs/**, data/macro_registry.json, cloudbuild.yaml),
       so a DOCS-ONLY push does not rebuild or redeploy. That is deliberate. It
       also means a change outside those paths will NOT reach production."
    - "⚠️ CORRECTED 21 Aug 2026. This entry used to say the daily job's audit
       checks section labels, columns and row counts 'NOT per-cell providers'.
       THAT WAS WRONG and it matters: snapshot.audit_snapshot calls
       _audit_method_contract (snapshot.py:401), which checks EVERY CELL's
       provider and request params. On 20 Aug that is exactly what failed - cells
       claiming Yahoo while carrying FRED's series_id - and because refresh
       returns 1 BEFORE the Firestore write, nothing published and the dashboard
       froze at a stale snapshot while still serving happily.
       audit.verify_snapshot_sources is a separate, stricter MANUAL command that
       re-fetches each cell from its provider and compares the value."
    - "Firestore writes require TEK2DAY_MACRO_ALLOW_CLOUD_WRITES=1 AND an explicit
       --confirm-project macro-data-222cd. Both guards, every time."

  # ⚠️ THE RULE THAT KEEPS BEING RESTATED WRONG - THIRD VERSION, 21 Aug 2026.
  # It said "never FRED", then "FRED for the prior columns only". Both are now
  # superseded. If you are about to restate it a fourth time, read
  # TEK2day-Macro-Data/docs/TREASURY_MIGRATION.md first.
  treasury_source_rule: >
    ALL THREE COLUMNS of the three rate rows come from the US TREASURY feed -
    13wk ROUND_B1_CLOSE_13WK_2 (data=daily_treasury_bill_rates), 10Y BC_10YEAR
    and 30Y BC_30YEAR (data=daily_treasury_yield_curve). Neither Yahoo nor FRED.
    Ruling 2026-08-21, superseding 2026-06-21 and 2026-08-20 for these rows.
    WHY: Yahoo caps ^IRX daily history at ~20 rows permanently and ^TYX
    intermittently, so the prior columns could only come from FRED - two
    providers in one row, which macro-data-contract.txt has ALWAYS forbidden
    ("do not mix providers inside a row") and which the per-cell audit rejects.
    The 2026-06-21 concern was that FRED LAGS; Treasury does not - it publishes
    same-day after the close and is where FRED gets the number.
    MEASURED 21 Aug 2026 before changing anything: Treasury matched every
    FRED-backfilled cell EXACTLY and every Yahoo cell to within 1 bp.
    ⚠️ ROUND_B1_YIELD_13WK_2 is the COUPON EQUIVALENT and runs 9-10 bp high.
    The bank discount field is the right one.
